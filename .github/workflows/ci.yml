name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run linter
      run: npm run lint
      continue-on-error: true

    - name: Run tests
      run: npm run test
      continue-on-error: true

    - name: Build project
      run: npm run build
      env:
        VITE_SOROBAN_NETWORK: testnet
        VITE_SOROBAN_CONTRACT_ID: CAU65DY66S74TTRKRWYCCAPK7WZCMHP6FBVKZIHU4BPFC56VKTBYMYBI
        VITE_SUPABASE_URL: https://mock.supabase.co
        VITE_SUPABASE_ANON_KEY: mock-key
